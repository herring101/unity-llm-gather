name: unity-package-ci

on:
  push:
    branches: [main, develop] # 適宜変更
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 1️⃣ Personal ライセンスをオンライン発行（ULF を outputs で受け取る）
      - name: Activate Unity
        uses: game-ci/unity-activate@v2
        id: activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.11f1
          imageVersion: 2.0 # ← linux-il2cpp-2.0 が存在するタグ

      # 2️⃣ EditMode テスト
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ steps.activate.outputs.unityLicense }}
        with:
          unityVersion: 2022.3.11f1
          projectPath: DevProject
          testMode: EditMode
          containerRegistryImageVersion: 2.0 # ← 同じ 2.0 を指定

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: test-results

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm pack UPM
        working-directory: Packages/com.toagihouse.unityllmgather
        run: npm pack --silent

      - name: Upload UPM tarball
        uses: actions/upload-artifact@v4
        with:
          name: unityllmgather-upm
          path: Packages/com.toagihouse.unityllmgather/*.tgz
