name: unity-package-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

env: # ❶ 共通で IMAGE を宣言しておく
  IMAGE: unityci/editor:ubuntu-2022.3.11f1-mono-2.0.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 1️⃣ ライセンスアクティベート
      - name: Activate Unity
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          IMAGE: ${{ env.IMAGE }} # ← 上書きポイント
        with:
          unityVersion: 2022.3.11f1

      # 2️⃣ EditMode テスト
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          IMAGE: ${{ env.IMAGE }} # ← 同じく
        with:
          unityVersion: 2022.3.11f1
          projectPath: DevProject
          testMode: EditMode

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: test-results

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm pack UPM
        working-directory: Packages/com.toagihouse.unityllmgather
        run: npm pack --silent

      - name: Upload UPM tarball
        uses: actions/upload-artifact@v4
        with:
          name: unityllmgather-upm
          path: Packages/com.toagihouse.unityllmgather/*.tgz
