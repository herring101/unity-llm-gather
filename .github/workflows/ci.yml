name: unity-package-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  ######################################################################
  # 1. テスト
  ######################################################################
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env: # ← すべての step で有効
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }} # 追加
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }} # 追加

    steps:
      - uses: actions/checkout@v4

      # (任意) ライセンスが渡っているか確認
      - name: Debug license length
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE is EMPTY"; exit 1;
          fi
          echo "License length: $(echo "$UNITY_LICENSE" | wc -c)"

      # EditMode テスト
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: 2022.3.11f1 # Unity エディタ
          projectPath: DevProject
          testMode: EditMode
          customImage: unityci/editor:2022.3.11f1-linux-il2cpp-2.0 # 実在タグ

      # テスト結果を保存
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: test-results

  ######################################################################
  # 2. UPM パッケージ作成
  ######################################################################
  package:
    runs-on: ubuntu-latest
    needs: test # ← テスト成功後に実行
    env: # ← 同じ 3 変数を共有
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm pack UPM
        working-directory: Packages/com.toagihouse.unityllmgather
        run: npm pack --silent

      - name: Upload UPM tarball
        uses: actions/upload-artifact@v4
        with:
          name: unityllmgather-upm
          path: Packages/com.toagihouse.unityllmgather/*.tgz
