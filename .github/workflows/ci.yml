# ================================================
# Unity LLM Gather — CI for UPM Editor Extension
# ================================================
# * EditMode テストのみ
# * Test runner が自動でライセンス認証を実行（Activate step 不要）
# * Docker イメージは「存在が確認できた mono 2.0.0 タグ」を明示
# * UPM tarball を artifacts に保存
# ------------------------------------------------

name: unity-package-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # ❶ EditMode テスト（ライセンス自動アクティベート含む）
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }} # Personal は任意／あると高速
        with:
          unityVersion: 2022.3.11f1
          projectPath: DevProject
          testMode: EditMode
          customImage: unityci/editor:2022.3.11f1-linux-il2cpp-2.0
