# ================================================
# Unity LLM Gather — CI for UPM Editor Extension
# ================================================
# * EditMode テストのみ（ビルド無し）
# * Unity 6000.0.47f1 でライセンスアクティベート
# * UPM パッケージを npm pack → アーティファクト
# ------------------------------------------------

name: unity-package-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 1) Unity ライセンスアクティベート（Unity 6000.0.47f1）
      - name: Activate Unity
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.11f1

      # 2) EditMode テスト
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2022.3.11f1
          testMode: EditMode
          projectPath: DevProject

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: test-results

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm pack UPM
        working-directory: Packages/com.toagihouse.unityllmgather
        run: npm pack --silent

      - name: Upload UPM tarball
        uses: actions/upload-artifact@v4
        with:
          name: unityllmgather-upm
          path: Packages/com.toagihouse.unityllmgather/*.tgz
