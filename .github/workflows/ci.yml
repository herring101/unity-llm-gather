# ================================================
# Unity LLM Gather — CI for UPM Editor Extension
# ================================================
# * EditMode テストのみ
# * Test runner が自動でライセンス認証を実行（Activate step 不要）
# * Docker イメージは「存在が確認できた mono 2.0.0 タグ」を明示
# * UPM tarball を artifacts に保存
# ------------------------------------------------

name: unity-package-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # ❶ EditMode テスト（ライセンス自動アクティベート含む）
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }} # Personal は任意／あると高速
        with:
          unityVersion: 2022.3.11f1
          projectPath: DevProject
          testMode: EditMode
          customImage: unityci/editor:ubuntu-2022.3.11f1-mono-2.0.0

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: test-results

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm pack UPM
        working-directory: Packages/com.toagihouse.unityllmgather
        run: npm pack --silent

      - name: Upload UPM tarball
        uses: actions/upload-artifact@v4
        with:
          name: unityllmgather-upm
          path: Packages/com.toagihouse.unityllmgather/*.tgz
